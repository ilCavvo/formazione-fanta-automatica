name: Schiera formazione

# Gli orari sono in UTC. In Italia (CEST, estate) vanno +2 ore; in inverno +1.
#
# La deadline di una giornata e' il primo anticipo, che tipicamente cade
# venerdi' o sabato sera. Il job gira piu' volte e decide da solo se e' il
# momento: si ferma senza fare nulla se mancano piu' di
# `deadline.skip_if_more_than_hours_before` ore, o se la deadline e' passata.
# Cosi' gli ultimi run catturano gli aggiornamenti dell'ultimo minuto sulle
# probabili senza rischiare di schierare su dati vecchi.
on:
  schedule:
    # Giovedi' sera: primo giro "a 24-48h", serve soprattutto ad accorgersi
    # per tempo se qualcosa e' rotto (login, selettori, fonti).
    - cron: "0 18 * * 4"
    # Venerdi': avvicinamento all'anticipo delle 20:45 CEST (18:45 UTC).
    - cron: "0 8,13,16,18 * * 5"
    # Sabato: anticipo delle 15:00 CEST (13:00 UTC) e delle 18:00.
    - cron: "0 7,11,12,15 * * 6"
    # Domenica: giornate che iniziano di domenica (soste, turni infrasettimanali).
    - cron: "0 7,10,12 * * 0"
    # Mercoledi'/martedi': turni infrasettimanali.
    - cron: "0 12,16 * * 2,3"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calcola e notifica senza inviare la formazione"
        type: boolean
        default: true
      force:
        description: "Ignora i controlli sulla deadline"
        type: boolean
        default: false
      log_level:
        description: "Livello di log"
        type: choice
        options: ["INFO", "DEBUG"]
        default: "INFO"

concurrency:
  # Due run sovrapposti scriverebbero la stessa formazione: mai in parallelo.
  group: schiera-formazione
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schiera:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Installa Chromium per Playwright
        run: python -m playwright install --with-deps chromium

      - name: Schiera la formazione
        env:
          FANTACALCIO_USERNAME: ${{ secrets.FANTACALCIO_USERNAME }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          FANTACALCIO_LEAGUE_SLUG: ${{ secrets.FANTACALCIO_LEAGUE_SLUG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Sui run schedulati vale il valore di config/config.yaml.
          # Su workflow_dispatch decide la spunta nel form.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
        run: |
          fantabot \
            --log-level "${{ inputs.log_level || 'INFO' }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} \
            run

      - name: Carica log e artefatti di debug
        # Servono soprattutto quando il run fallisce: contengono HTML e
        # screenshot delle pagine della lega al momento dell'errore.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantabot-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/
          retention-days: 14
          if-no-files-found: warn
