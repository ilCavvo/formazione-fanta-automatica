# ============================================================================
# fantabot - configurazione
# Tutte le regole di formazione sono qui: per cambiare comportamento NON serve
# toccare il codice. Le credenziali NON stanno qui: arrivano dalle env var
# (GitHub Actions Secrets). Vedi .env.example.
# ============================================================================

# --- Sicurezza / modalita' -------------------------------------------------
run:
  # Se true calcola la formazione e manda la notifica Telegram ma NON invia
  # nulla al sito.
  #
  # Ora e' false: l'invio via API e' stato provato per davvero e il sito ha
  # confermato (`formazione 4-3-3 inviata via API e verificata nella
  # risposta`, run 34409353250). Con true i run automatici calcolerebbero la
  # formazione senza mai schierarla — cioe' non farebbero il loro mestiere.
  #
  # Per una prova senza rischi non serve cambiare questo file: lancia la
  # action a mano con dry_run spuntato, oppure `--dry-run` da riga di comando.
  # Override runtime: env var DRY_RUN=true|false, oppure --dry-run/--no-dry-run.
  dry_run: false

  # Cartella dove finiscono log e artefatti del run (caricati come artifact CI).
  output_dir: "out"

  # Salva su disco l'HTML grezzo di ogni pagina scaricata (utile per debug e
  # per aggiornare i parser quando un sito cambia struttura).
  save_raw_html: true

# --- Comportamento "gentile" verso i siti sorgente --------------------------
http:
  user_agent: "fantabot/0.1 (+uso personale, non commerciale)"
  # Secondi di attesa tra due richieste allo stesso host.
  delay_between_requests_s: 2.0
  timeout_s: 30
  max_retries: 3
  # Backoff esponenziale: attesa = backoff_base_s * 2**tentativo
  backoff_base_s: 2.0
  # Cache su disco delle risposte, in minuti (0 = disattivata).
  # Utile nei run ravvicinati e per non ribattere sugli stessi siti.
  cache_ttl_minutes: 10

# --- Regolamento della lega -------------------------------------------------
league:
  # Lo slug e' il pezzo di URL: https://leghe.fantacalcio.it/<slug>/
  # Puoi lasciarlo vuoto qui e passarlo con FANTACALCIO_LEAGUE_SLUG.
  slug: ""

  # Identificativo della TUA squadra: il numero in fondo all'URL della rosa,
  # https://leghe.fantacalcio.it/<slug>/view/rosters/<team_id>
  # (ogni squadra della lega ne ha uno diverso).
  # Puoi lasciarlo vuoto qui e passarlo con FANTACALCIO_TEAM_ID.
  # Se non lo sai, lancia `fantabot discover`: lo trova da solo.
  team_id: ""

  # "classic" oppure "mantra". Attualmente e' implementato "classic".
  mode: "classic"

  # Invia la formazione tramite l'API della lega invece che cliccando nella
  # pagina. Piu' veloce e soprattutto piu' corretto: il modulo e gli undici
  # vengono scritti esplicitamente e riletti dalla risposta per verificarli,
  # mentre cliccando sui nomi l'app ricomponeva una formazione sua.
  # Se l'API risponde in modo inatteso si ripiega da soli sul browser, quindi
  # metterlo a false serve solo per escluderla del tutto.
  use_api: true

  # Se true, all'avvio l'agente legge la pagina regolamento della lega e prova a
  # dedurre moduli ammessi e modificatori, sovrascrivendo i valori qui sotto.
  # Se la lettura fallisce, si usano i valori di questo file (nessun blocco).
  autodetect_rules: true

  # Moduli ammessi (difensori-centrocampisti-attaccanti, portiere implicito).
  # Sono i moduli standard di Fantacalcio Classic.
  allowed_modules:
    - "3-4-3"
    - "3-5-2"
    - "4-3-3"
    - "4-4-2"
    - "4-5-1"
    - "5-3-2"
    - "5-4-1"

  # Vincoli di reparto (ridondanti rispetto ai moduli, ma servono da guardia
  # se un giorno aggiungi moduli a mano).
  slots:
    portieri: 1
    difensori: { min: 3, max: 5 }
    centrocampisti: { min: 3, max: 5 }
    attaccanti: { min: 1, max: 3 }

  # Panchina: quante riserve inviare, in ordine di subentro.
  bench_size: 14

  modifiers:
    # Modificatore difesa: se attivo conviene schierare 4 (o 5) difensori.
    # ATTIVO, e non e' un'ipotesi: il registro delle chiamate della lega
    # (onboarding/v1/league/settings/calculate) riporta
    #   "smodd": {"smodlu": 7.75, "smodld": 6, "smodty": 1, "smoddg": true}
    # mentre gli altri modificatori (smodg, smodm, smodf, smodp) sono null.
    modificatore_difesa: true
    modificatore_portiere: false
    modificatore_centrocampo: false
    modificatore_attacco: false

# --- Fonti delle probabili formazioni --------------------------------------
sources:
  # Il peso pesa il voto della fonte nel calcolo della maggioranza.
  # enabled: false esclude la fonte senza toccare il codice.
  fantacalcio_it:
    enabled: true
    weight: 1.0
    # Questa fonte espone anche la percentuale di titolarita' (es. 90%, 60%).
    url: "https://www.fantacalcio.it/probabili-formazioni-serie-a"
  sky:
    enabled: true
    weight: 1.0
    url: "https://sport.sky.it/calcio/serie-a/probabili-formazioni"
  gazzetta:
    enabled: true
    weight: 1.0
    # Gazzetta non pubblica una pagina strutturata di probabili: l'agente cerca
    # l'articolo-guida della giornata e prova a estrarne le formazioni.
    # Se non ci riesce la fonte viene marcata "non disponibile" e la
    # maggioranza si calcola sulle fonti rimaste (vedi min_sources).
    index_url: "https://www.gazzetta.it/calcio/fantanews/"

  # Sotto questo numero di fonti effettivamente disponibili il run e' considerato
  # inaffidabile: l'agente NON invia la formazione e manda un alert Telegram.
  min_sources: 1

  # Pagine di indisponibili (infortunati/squalificati). Chi compare qui viene
  # escluso dai titolari a prescindere dalle probabili.
  unavailability:
    enabled: true
    infortunati_url: "https://www.fantacalcio.it/infortunati-serie-a"
    squalificati_url: "https://www.fantacalcio.it/squalificati-e-diffidati-campionato-serie-a"

# --- Statistiche di Serie A -------------------------------------------------
# Due sole pagine, sullo stesso host delle probabili. Servono a sapere CHI si
# affronta e COME sta andando un giocatore. Se una delle due non risponde il
# run prosegue: sono contributi al punteggio, non requisiti.
statistiche:
  enabled: true
  # Gol fatti/subiti, partite giocate e forma recente di ogni squadra.
  classifica_url: "https://www.fantacalcio.it/serie-a/classifica"
  # Per ogni giocatore di Serie A: PV, MV, FM, gol, assist, ammonizioni...
  statistiche_url: "https://www.fantacalcio.it/statistiche-serie-a"

# --- Aggregazione delle probabili ------------------------------------------
aggregation:
  # Come si trasforma il verdetto di una fonte in un voto:
  #   starter -> 1.0, doubt -> 0.5, bench/assente -> 0.0
  # Il giocatore e' TITOLARE se la media pesata dei voti supera questa soglia.
  starter_threshold: 0.60
  # Sotto starter_threshold ma sopra doubt_threshold => DUBBIO.
  doubt_threshold: 0.34

  # Fuzzy matching dei nomi tra fonti diverse (Sky scrive "Bijlow J.",
  # Fantacalcio.it scrive "Bijlow").
  matching:
    min_score: 86          # 0-100, soglia rapidfuzz per accettare un match
    require_same_team: true # due omonimi di squadre diverse non si confondono
    alias_file: "config/aliases.yaml"

  # Come sciogliere un pareggio secco (es. 1 fonte titolare, 1 panchina, 1 assente).
  # Vengono applicati in ordine, il primo criterio disponibile decide.
  tiebreakers:
    - "probabilita_media"   # percentuale media di titolarita' (solo fantacalcio.it)
    - "titolarita_recente"  # presenze nelle ultime giornate, se disponibili
    - "fantamedia"          # fantamedia stagionale, se disponibile
    - "ordine_rosa"         # ordine in cui i giocatori compaiono nella tua rosa

# --- Logica di scelta della formazione --------------------------------------
lineup:
  # Punteggio base per stato aggregato del giocatore.
  scores:
    starter: 100.0
    doubt: 45.0
    bench: 8.0
    unknown: 25.0        # nessuna fonte lo nomina
    out: -1000.0         # infortunato/squalificato: mai titolare

  weights:
    # Quanto pesa la percentuale media di titolarita' (0-100 -> 0-1 * peso).
    probabilita: 25.0
    # Quanto pesa l'accordo tra le fonti (0-1 * peso).
    consenso: 15.0
    # Spinta minima per rispettare l'ordine della tua rosa a parita' di tutto.
    ordine_rosa: 0.5

    # -- Chi si affronta ------------------------------------------------------
    # Quanto conta la squadra avversaria, per ruolo. Il metro cambia col ruolo:
    # portiere e difensori sono misurati sull'ATTACCO avversario (piu' gol fa,
    # meno valgono), centrocampisti e attaccanti sulla sua DIFESA (piu' gol
    # incassa, piu' valgono). In entrambi i casi: avversario forte, punteggio
    # minore.
    # Il portiere ha il peso piu' alto perche' subisce l'attacco per intero e
    # non ha bonus con cui rifarsi. Metti 0 a un ruolo per spegnerlo.
    avversario:
      P: 10.0
      D: 5.0
      C: 3.0
      A: 4.0
    # Tutto e' misurato come scarto dalla media del campionato, cosi' un
    # avversario nella norma non sposta niente. Questo e' lo scarto massimo
    # considerato: a inizio stagione bastano tre partite per produrre medie
    # che non significano nulla, e senza un tetto dominerebbero il calcolo.
    max_scarto_avversario: 1.5
    # Forma recente (punti per partita nelle ultime, dalla classifica).
    forma_squadra: 4.0      # la mia squadra in forma spinge il giocatore
    # L'avversario in forma frena. Segue lo stesso dosaggio per ruolo dei pesi
    # qui sopra: altrimenti peserebbe uguale su tutti e cancellerebbe la
    # distinzione fra il portiere e gli altri.
    forma_avversario: 3.0

    # -- Come sta andando il giocatore ---------------------------------------
    # Media voto, misurata sulla sufficienza: il 6 e' il punto neutro.
    media_voto: 12.0
    # Bonus e malus medi a partita. Si ricavano come fantamedia meno media
    # voto: quella differenza E' gia' il saldo dei bonus, calcolato dal sito
    # col regolamento vero, senza doverne indovinare i valori.
    # La fantamedia non ha un peso suo perche' e' la somma dei due qui sopra:
    # pesarla di nuovo vorrebbe dire contare due volte le stesse partite.
    bonus: 14.0
    max_scarto_bonus: 2.5
    # Sotto questo numero di partite giocate le medie sono rumore e non si
    # usano: ne' per il giocatore, ne' per la squadra avversaria.
    min_partite: 2
    # Tetto complessivo di TUTTI i contributi statistici messi insieme.
    # 0 = nessun tetto, ed e' il default: un giocatore forte che gioca sempre
    # deve poter battere un titolare scarso anche quando le probabili lo danno
    # in panchina. Con i pesi qui sopra serve un divario estremo, quindi
    # succede di rado — che e' l'intenzione.
    # Attenzione: questo NON riguarda gli indisponibili. Infortunati e
    # squalificati sono esclusi prima del punteggio, quindi nessuna statistica
    # per quanto buona puo' rimetterli in campo.
    # Se un giorno vuoi che le probabili comandino sempre, metti qui un numero
    # sotto la meta' della distanza titolare-dubbio (55/2 = 27).
    max_totale_statistiche: 0.0

  penalties:
    # Malus se la squadra del giocatore non gioca in questa giornata (riposo,
    # rinvio) o se non risulta nelle probabili di nessuna fonte.
    squadra_non_in_campo: 500.0
    # Malus per ogni titolare "dubbio" schierato: scoraggia i moduli che
    # costringono a rischiare.
    per_dubbio_schierato: 12.0

  module_bonus:
    # Bonus applicato al punteggio totale del modulo. Serve a esprimere
    # preferenze che non dipendono dai singoli giocatori.
    # Attivo solo se league.modifiers.modificatore_difesa e' true.
    difesa_a_4_con_modificatore: 60.0
    difesa_a_5_con_modificatore: 25.0
    # Preferenza generica (sempre attiva), utile per rompere la parita' tra
    # moduli con punteggio quasi identico. Chiave = modulo.
    preferenze:
      "3-5-2": 2.0
      "4-4-2": 1.5
      "3-4-3": 1.0

  # Se dopo la selezione restano meno di 11 titolari validi (rosa incompleta),
  # completa comunque con i migliori disponibili invece di fallire.
  allow_incomplete_lineup: true

  # Ordine della panchina, cioe' l'ordine in cui si prova il subentro.
  #   punteggio_portieri_in_fondo  dal punteggio piu' alto al piu' basso, con
  #                                i portieri sempre in coda (default)
  #   solo_punteggio               punteggio puro, portieri compresi
  #   per_ruolo_poi_punteggio      raggruppata per ruolo P, D, C, A
  # Il default tiene i portieri in fondo perche' una riserva fra i pali serve
  # solo nel caso raro in cui il titolare non giochi: davanti deve stare chi
  # puo' entrare davvero.
  bench_strategy: "punteggio_portieri_in_fondo"

# --- Deadline della giornata ------------------------------------------------
deadline:
  # Fonte del calendario per calcolare l'ora del primo anticipo.
  calendar_url: "https://www.fantacalcio.it/serie-a/calendario"
  timezone: "Europe/Rome"
  # Margine di sicurezza: l'agente considera scaduta la giornata gia' N minuti
  # prima del primo fischio d'inizio.
  safety_margin_minutes: 20
  # Se true, prova anche a leggere la deadline dalla pagina formazione della
  # lega dopo il login (piu' precisa: alcune leghe la spostano).
  prefer_league_deadline: true
  # Il run si ferma (senza errore) se mancano piu' di N ore alla deadline:
  # evita di schierare su probabili ancora vuote.
  skip_if_more_than_hours_before: 60

# --- Notifiche Telegram -----------------------------------------------------
telegram:
  enabled: true
  # Manda un messaggio anche quando e' tutto ok (false = solo errori).
  notify_on_success: true
  parse_mode: "HTML"
  # Includi nel messaggio il dettaglio di come e' stato risolto ogni dubbio.
  include_decisions: true
  # Includi la lista completa della panchina.
  include_bench: false

# --- Logging ----------------------------------------------------------------
logging:
  level: "INFO"          # DEBUG per il massimo dettaglio
  file: "fantabot.log"
